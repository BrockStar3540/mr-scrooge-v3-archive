<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mr. Scrooge V3</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <div class="hdr-left">
    <h1>SCROOGE V3</h1>
    <span id="mode-badge" class="badge badge-dry">DRY</span>
    <span class="refresh-label">4s</span>
  </div>
  <div id="sessions" class="hdr-right"></div>
</header>

<section class="metrics-bar" id="metrics-bar"></section>
<section class="info-row" id="info-row"></section>

<nav class="tab-bar">
  <button class="tab active" data-tab="signals">Signals</button>
</nav>

<section id="signals-grid" class="signals-grid"></section>

<footer>Mr. Scrooge V3 &mdash; Plug-in Trading Platform</footer>

<script>
const BASE = window.location.protocol + '//' + window.location.host;

// V3 Scorer factor labels for display
const FACTOR_LABELS = {
  hr: 'Entry Hour', age: 'Box Age', stp: 'Nat Stop', vol: 'Volume',
  mom: 'Momentum', dc: 'Dir Candles', z: 'Z-Score', bb: 'BB Pos',
  e50: 'EMA50 Dist', e20: 'EMA20 Dist', otr: 'OTR', adr: 'ADR Consumed',
  dur: 'Duration', wal: 'Wall Prox', bdy: 'Body %', bbs: 'BB State', rsi: 'RSI'
};
const PAIR_LABELS = {
  p_hr_norm: '00-07+NORM', p_hr_mom0: '00-07+mom0', p_hr_z: '00-07+z.5-1',
  p_hr_ns: '00-07+ns4-6', p_hr_age: '00-07+fresh', p_z_norm: 'z1-1.5+NORM',
  p_hr_e50: '00-07+e50>60', p_age_rsi: 'fresh+RSI<45', p_age_otr: 'fresh+OTR8-18',
  p_age_norm: 'fresh+NORM',
  n_hr_adr: '12-15+ADR.8-1.2', n_hr_dc0: '12-15+dc0', n_z_adr: 'z<.5+ADR',
  n_z_bdy: 'z<.5+body', n_mom_bb: 'mom0+bb>.85', n_ns_vr: 'ns<4+vol.7-.9',
  n_dc_otr: 'dc0+OTR<8', n_z_norm: 'z<.5+NORM'
};

async function load() {
  try {
    const r = await fetch(BASE + '/api/data');
    if (!r.ok) return;
    render(await r.json());
  } catch(e) { console.error(e); }
}

function render(d) {
  renderHeader(d);
  renderMetrics(d);
  renderInfo(d);
  renderSignals(d.signals || []);
}

function renderHeader(d) {
  const b = document.getElementById('mode-badge');
  b.textContent = d.system.dry_run ? 'DRY' : 'LIVE';
  b.className = d.system.dry_run ? 'badge badge-dry' : 'badge badge-live';
  const all = ['London','New York','Tokyo','Sydney'];
  document.getElementById('sessions').innerHTML = all.map(s =>
    `<span class="sdot ${(d.sessions||[]).includes(s)?'on':''}">${s}</span>`
  ).join('') + `<span class="clock">${new Date().toUTCString().slice(17,25)} UTC</span>`;
}

function renderMetrics(d) {
  const a = d.account, s = d.scan, sys = d.system;
  document.getElementById('metrics-bar').innerHTML = `
    <div class="m"><label>EQUITY</label><span class="v">$${a.equity.toLocaleString('en',{minimumFractionDigits:2})}</span></div>
    <div class="m"><label>DAILY PNL</label><span class="v ${a.daily_pnl>=0?'pos':'neg'}">${a.daily_pnl>=0?'+':''}$${a.daily_pnl.toFixed(2)}</span></div>
    <div class="m"><label>REALIZED P/L</label><span class="v ${a.realized_pl>=0?'pos':'neg'}">$${a.realized_pl.toFixed(2)}</span></div>
    <div class="m"><label>POSITIONS</label><span class="v">${a.position_count}</span></div>
    <div class="m"><label>SCANNED</label><span class="v">${s.pairs_scanned}</span></div>
    <div class="m"><label>VIABLE</label><span class="v">${s.pairs_viable}</span></div>
    <div class="m"><label>CYCLE</label><span class="v">${sys.cycle_count}</span></div>
    <div class="m"><label>UPDATED</label><span class="v">${sys.last_update}</span></div>`;
}

function renderInfo(d) {
  const dec = d.decision;
  document.getElementById('info-row').innerHTML = `
    <div class="ic"><h3>DECISION</h3>
      <span class="pos">VALID ${dec.valid}</span> &nbsp;
      <span class="neg">REJECTED ${dec.rejected}</span>
    </div>`;
}

function renderSignals(signals) {
  const el = document.getElementById('signals-grid');
  if (!signals.length) { el.innerHTML = '<div class="empty">No pairs scanned this cycle</div>'; return; }

  // Sort: TAKE first, then by score descending
  signals.sort((a,b) => {
    const va = a.verdict.startsWith('TAKE') ? 1000 : 0;
    const vb = b.verdict.startsWith('TAKE') ? 1000 : 0;
    return (vb + (b.scorer?.score||0)) - (va + (a.scorer?.score||0));
  });

  el.innerHTML = signals.map(renderPairCard).join('');
}

function renderPairCard(sig) {
  const sc = sig.scorer || {};
  const bd = sc.breakdown || {};
  const score = sc.score || 0;
  const tier = sc.tier || '';
  const blocks = sc.blocks || [];
  const verdict = sig.verdict || '';

  // Verdict badge
  let vclass = 'v-no', vlabel = verdict;
  if (verdict.startsWith('TAKE')) { vclass = 'v-take'; vlabel = `TAKE (${tier})`; }
  else if (verdict === 'V3_BLOCKED') { vclass = 'v-block'; vlabel = 'BLOCKED'; }
  else if (verdict === 'V3_REJECT') { vclass = 'v-rej'; }

  // BB state from classifications
  const bbState = sig.classifications?.bb_state?.label || '—';
  const regimeLabel = sig.classifications?.regime?.label || '—';
  const regimeScore = sig.classifications?.regime?.metadata?.score ?? '—';

  // Features
  const f = sig.features || {};
  const rsi = f.rsi?.rsi ?? '—';
  const zScore = f.bollinger?.z_score ?? '—';
  const bbPos = f.bollinger?.bb_position ?? '—';
  const boxAge = f.zone_detector?.box_age_hours ?? '—';
  const wallProx = f.zone_detector?.wall_proximity ?? '—';
  const otr = f.otr?.otr_ratio != null ? (f.otr.otr_ratio * 100).toFixed(1) + '%' : '—';
  const adr = f.atr?.adr_consumed ?? '—';
  const ema20 = f.ema?.ema20_dist_pct ?? '—';
  const ema50 = f.ema?.ema50_dist_pct ?? '—';
  const volRatio = f.volume?.volume_ratio ?? '—';

  // Scorer factor rows (Layer 1)
  let factorRows = '';
  const factorKeys = ['hr','age','stp','vol','mom','dc','z','bb','e50','e20','otr','adr','dur','wal','bdy','bbs','rsi'];
  for (const k of factorKeys) {
    if (bd[k] !== undefined) {
      const pts = bd[k];
      const cls = pts > 0 ? 'fpos' : pts < 0 ? 'fneg' : 'fzero';
      factorRows += `<div class="frow"><span class="fname">${FACTOR_LABELS[k]||k}</span><span class="fpts ${cls}">${pts>0?'+':''}${pts}</span></div>`;
    }
  }

  // Pair bonuses (Layer 2)
  let pairRows = '';
  const pairsTotal = sc.pairs_total || 0;
  for (const [k, v] of Object.entries(bd)) {
    if (k.startsWith('p_') || k.startsWith('n_')) {
      const cls = v > 0 ? 'fpos' : 'fneg';
      const label = PAIR_LABELS[k] || k;
      pairRows += `<span class="ptag ${cls}">${label} ${v>0?'+':''}${v}</span> `;
    }
  }

  // Hard blocks
  let blockHtml = '';
  if (blocks.length) {
    blockHtml = `<div class="hblock">${blocks.map(b => `<span class="btag">${b}</span>`).join(' ')}</div>`;
  }

  // Gate results
  let gateHtml = '';
  for (const [name, g] of Object.entries(sig.gates || {})) {
    if (name === '_rejection') continue;
    const cls = g.passed ? 'gp' : 'gf';
    gateHtml += `<div class="grow"><span class="gn">${name}</span><span class="${cls}">${g.passed?'PASS':'FAIL'}</span></div>`;
  }

  return `
  <div class="card ${verdict.startsWith('TAKE')?'card-take':''}">
    <div class="card-hdr">
      <span class="pair">${sig.symbol.replace('_','/')}</span>
      <span class="bb-tag">${bbState}</span>
      <span class="regime-tag">R:${regimeScore}</span>
      <span class="${vclass}">${vlabel}</span>
    </div>

    <div class="card-features">
      <span>RSI <b>${typeof rsi==='number'?rsi.toFixed(0):rsi}</b></span>
      <span>Z <b>${typeof zScore==='number'?zScore.toFixed(2):zScore}</b></span>
      <span>BB <b>${typeof bbPos==='number'?bbPos.toFixed(2):bbPos}</b></span>
      <span>Box <b>${typeof boxAge==='number'?boxAge.toFixed(1)+'h':boxAge}</b></span>
      <span>OTR <b>${otr}</b></span>
      <span>ADR <b>${typeof adr==='number'?adr.toFixed(2):adr}</b></span>
      <span>EMA20 <b>${typeof ema20==='number'?ema20.toFixed(0)+'%':ema20}</b></span>
      <span>EMA50 <b>${typeof ema50==='number'?ema50.toFixed(0)+'%':ema50}</b></span>
      <span>Vol <b>${typeof volRatio==='number'?volRatio.toFixed(2):volRatio}</b></span>
      <span>Wall <b>${typeof wallProx==='number'?wallProx.toFixed(2):wallProx}</b></span>
    </div>

    ${blockHtml}

    ${score ? `
    <div class="scorer-section">
      <div class="score-hdr">
        <span class="score-label">V3 SCORE</span>
        <span class="score-val ${tier==='A'?'tier-a':tier==='B'?'tier-b':'tier-rej'}">${score}</span>
        <span class="score-tier">${tier}</span>
        ${pairsTotal?`<span class="pairs-badge ${pairsTotal>0?'fpos':'fneg'}">Pairs: ${pairsTotal>0?'+':''}${pairsTotal}</span>`:''}
      </div>
      <div class="factor-grid">${factorRows}</div>
      ${pairRows ? `<div class="pair-section">${pairRows}</div>` : ''}
    </div>` : ''}

    ${gateHtml ? `<div class="gate-section">${gateHtml}</div>` : ''}
  </div>`;
}

document.querySelector('.tab-bar').addEventListener('click', e => {
  if (e.target.classList.contains('tab')) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
  }
});

load();
setInterval(load, 4000);
</script>
</body>
</html>
