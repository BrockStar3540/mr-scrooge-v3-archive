<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mr. Scrooge V3</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <div class="hdr-left">
    <h1>SCROOGE V3</h1>
    <span id="mode-badge" class="badge badge-dry">DRY</span>
    <span class="refresh-label">4s</span>
  </div>
  <div id="sessions" class="hdr-right"></div>
</header>

<section class="metrics-bar" id="metrics-bar"></section>
<section class="info-row" id="info-row"></section>

<nav class="tab-bar">
  <button class="tab active" data-tab="signals">Signals</button>
  <button class="tab" data-tab="execution">Execution</button>
  <button class="tab" data-tab="dbb">DBB Trend</button>
</nav>

<section id="signals-grid" class="signals-grid"></section>
<section id="execution-panel" class="execution-panel" style="display:none"></section>
<section id="dbb-panel" class="execution-panel" style="display:none"></section>

<footer>Mr. Scrooge V3 &mdash; Plug-in Trading Platform</footer>

<script>
const BASE = window.location.protocol + '//' + window.location.host;

// V3 Scorer factor labels for display
const FACTOR_LABELS = {
  hr: 'Hour Pen', age: 'Box Age', stp: 'Nat Stop', vol: 'Volume',
  mom: 'Momentum', dc: 'Dir Candles', z: 'Z-Score', bb: 'BB Pos',
  e50: 'EMA50 Dist', e20: 'EMA20 Dist', otr: 'OTR', adr: 'ADR Consumed',
  dur: 'Duration', wal: 'Wall Prox', bdy: 'Body %', bbs: 'BB State', rsi: 'RSI'
};
const PAIR_LABELS = {
  p_hr_norm: '00-07+NORM', p_hr_mom0: '00-07+mom0', p_hr_z: '00-07+z.5-1',
  p_hr_ns: '00-07+ns4-6', p_hr_age: '00-07+fresh', p_z_norm: 'z1-1.5+NORM',
  p_hr_e50: '00-07+e50>60', p_age_rsi: 'fresh+RSI<45', p_age_otr: 'fresh+OTR8-18',
  p_age_norm: 'fresh+NORM',
  n_hr_adr: '12-15+ADR.8-1.2', n_hr_dc0: '12-15+dc0', n_z_adr: 'z<.5+ADR',
  n_z_bdy: 'z<.5+body', n_mom_bb: 'mom0+bb>.85', n_ns_vr: 'ns<4+vol.7-.9',
  n_dc_otr: 'dc0+OTR<8', n_z_norm: 'z<.5+NORM'
};

async function load() {
  try {
    const r = await fetch(BASE + '/api/data');
    if (!r.ok) return;
    render(await r.json());
  } catch(e) { console.error(e); }
}

function render(d) {
  renderHeader(d);
  renderMetrics(d);
  renderInfo(d);
  renderSignals(d.signals || []);
  renderExecution(d.execution || {});
  renderDBB(d.dbb || {});
}

function renderHeader(d) {
  const b = document.getElementById('mode-badge');
  b.textContent = d.system.dry_run ? 'DRY' : 'LIVE';
  b.className = d.system.dry_run ? 'badge badge-dry' : 'badge badge-live';
  const all = ['London','New York','Tokyo','Sydney'];
  document.getElementById('sessions').innerHTML = all.map(s =>
    `<span class="sdot ${(d.sessions||[]).includes(s)?'on':''}">${s}</span>`
  ).join('') + `<span class="clock">${new Date().toUTCString().slice(17,25)} UTC</span>`;
}

function renderMetrics(d) {
  const a = d.account, s = d.scan, sys = d.system;
  document.getElementById('metrics-bar').innerHTML = `
    <div class="m"><label>BALANCE</label><span class="v">$${a.balance.toLocaleString('en',{minimumFractionDigits:2})}</span></div>
    <div class="m"><label>EQUITY</label><span class="v">$${a.equity.toLocaleString('en',{minimumFractionDigits:2})}</span></div>
    <div class="m"><label>DAILY PNL</label><span class="v ${a.daily_pnl>=0?'pos':'neg'}">${a.daily_pnl>=0?'+':''}$${a.daily_pnl.toFixed(2)}</span></div>
    <div class="m"><label>UNREALIZED P/L</label><span class="v ${a.unrealized_pl>=0?'pos':'neg'}">$${a.unrealized_pl.toFixed(2)}</span></div>
    <div class="m"><label>POSITIONS</label><span class="v">${a.position_count}</span></div>
    <div class="m"><label>SCANNED</label><span class="v">${s.pairs_scanned}</span></div>
    <div class="m"><label>VIABLE</label><span class="v">${s.pairs_viable}</span></div>
    <div class="m"><label>CYCLE</label><span class="v">${sys.cycle_count}</span></div>
    <div class="m"><label>UPDATED</label><span class="v">${sys.last_update}</span></div>
    ${a.spread_skips ? '<div class="m"><label>SPREAD SKIPS</label><span class="v neg">' + a.spread_skips + ' (' + (a.last_spread_skip||'') + ')</span></div>' : ''}
    ${a.pending_limit_orders ? '<div class="m"><label>PENDING LIMITS</label><span class="v">' + a.pending_limit_orders + '</span></div>' : ''}`;
}

function renderInfo(d) {
  const dec = d.decision;
  document.getElementById('info-row').innerHTML = `
    <div class="ic"><h3>DECISION</h3>
      <span class="pos">VALID ${dec.valid}</span> &nbsp;
      <span class="neg">REJECTED ${dec.rejected}</span>
    </div>`;
}

function renderSignals(signals) {
  const el = document.getElementById('signals-grid');
  if (!signals.length) { el.innerHTML = '<div class="empty">No pairs scanned this cycle</div>'; return; }

  // Sort: TAKE first, then by score descending
  signals.sort((a,b) => {
    const va = a.verdict.startsWith('TAKE') ? 1000 : 0;
    const vb = b.verdict.startsWith('TAKE') ? 1000 : 0;
    return (vb + (b.scorer?.score||0)) - (va + (a.scorer?.score||0));
  });

  el.innerHTML = signals.map(renderPairCard).join('');
}

function renderPairCard(sig) {
  const sc = sig.scorer || {};
  const bd = sc.breakdown || {};
  const score = sc.score || 0;
  const tier = sc.tier || '';
  const blocks = sc.blocks || [];
  const verdict = sig.verdict || '';

  // Verdict badge
  let vclass = 'v-no', vlabel = verdict;
  if (verdict.startsWith('TAKE')) { vclass = 'v-take'; vlabel = `TAKE (${tier})`; }
  else if (verdict === 'V3_BLOCKED') { vclass = 'v-block'; vlabel = 'BLOCKED'; }
  else if (verdict === 'V3_REJECT') { vclass = 'v-rej'; }

  // BB state from classifications
  const bbState = sig.classifications?.bb_state?.label || '—';
  const regimeLabel = sig.classifications?.regime?.label || '—';
  const regimeScore = sig.classifications?.regime?.metadata?.score ?? '—';

  // Features
  const f = sig.features || {};
  const rsi = f.rsi?.rsi ?? '—';
  const zScore = f.bollinger?.z_score ?? '—';
  const bbPos = f.bollinger?.bb_position ?? '—';
  const boxAge = f.zone_detector?.box_age_hours ?? '—';
  const wallProx = f.zone_detector?.wall_proximity ?? '—';
  const otr = f.otr?.otr_ratio != null ? (f.otr.otr_ratio * 100).toFixed(1) + '%' : '—';
  const adr = f.atr?.adr_consumed ?? '—';
  const ema20 = f.ema?.ema20_dist_pct ?? '—';
  const ema50 = f.ema?.ema50_dist_pct ?? '—';
  const volRatio = f.volume?.volume_ratio ?? '—';

  // Scorer factor rows (Layer 1)
  let factorRows = '';
  const factorKeys = ['hr','age','stp','vol','mom','dc','z','bb','e50','e20','otr','adr','dur','wal','bdy','bbs','rsi'];
  for (const k of factorKeys) {
    if (bd[k] !== undefined) {
      const pts = bd[k];
      const cls = pts > 0 ? 'fpos' : pts < 0 ? 'fneg' : 'fzero';
      factorRows += `<div class="frow"><span class="fname">${FACTOR_LABELS[k]||k}</span><span class="fpts ${cls}">${pts>0?'+':''}${pts}</span></div>`;
    }
  }

  // Pair bonuses (Layer 2)
  let pairRows = '';
  const pairsTotal = sc.pairs_total || 0;
  for (const [k, v] of Object.entries(bd)) {
    if (k.startsWith('p_') || k.startsWith('n_')) {
      const cls = v > 0 ? 'fpos' : 'fneg';
      const label = PAIR_LABELS[k] || k;
      pairRows += `<span class="ptag ${cls}">${label} ${v>0?'+':''}${v}</span> `;
    }
  }

  // Hard blocks
  let blockHtml = '';
  if (blocks.length) {
    blockHtml = `<div class="hblock">${blocks.map(b => `<span class="btag">${b}</span>`).join(' ')}</div>`;
  }

  // Gate results
  let gateHtml = '';
  for (const [name, g] of Object.entries(sig.gates || {})) {
    if (name === '_rejection') continue;
    const cls = g.passed ? 'gp' : 'gf';
    gateHtml += `<div class="grow"><span class="gn">${name}</span><span class="${cls}">${g.passed?'PASS':'FAIL'}</span></div>`;
  }

  return `
  <div class="card ${verdict.startsWith('TAKE')?'card-take':''}">
    <div class="card-hdr">
      <span class="pair">${sig.symbol.replace('_','/')}</span>
      <span class="bb-tag">${bbState}</span>
      <span class="regime-tag">R:${regimeScore}</span>
      <span class="${vclass}">${vlabel}</span>
    </div>

    <div class="card-features">
      <span>RSI <b>${typeof rsi==='number'?rsi.toFixed(0):rsi}</b></span>
      <span>Z <b>${typeof zScore==='number'?zScore.toFixed(2):zScore}</b></span>
      <span>BB <b>${typeof bbPos==='number'?bbPos.toFixed(2):bbPos}</b></span>
      <span>Box <b>${typeof boxAge==='number'?boxAge.toFixed(1)+'h':boxAge}</b></span>
      <span>OTR <b>${otr}</b></span>
      <span>ADR <b>${typeof adr==='number'?adr.toFixed(2):adr}</b></span>
      <span>EMA20 <b>${typeof ema20==='number'?ema20.toFixed(0)+'%':ema20}</b></span>
      <span>EMA50 <b>${typeof ema50==='number'?ema50.toFixed(0)+'%':ema50}</b></span>
      <span>Vol <b>${typeof volRatio==='number'?volRatio.toFixed(2):volRatio}</b></span>
      <span>Wall <b>${typeof wallProx==='number'?wallProx.toFixed(2):wallProx}</b></span>
    </div>

    ${blockHtml}

    ${score ? `
    <div class="scorer-section">
      <div class="score-hdr">
        <span class="score-label">V3 SCORE</span>
        <span class="score-val ${tier==='A'?'tier-a':tier==='B'?'tier-b':'tier-rej'}">${score}</span>
        <span class="score-tier">${tier}</span>
        ${pairsTotal?`<span class="pairs-badge ${pairsTotal>0?'fpos':'fneg'}">Pairs: ${pairsTotal>0?'+':''}${pairsTotal}</span>`:''}
      </div>
      <div class="factor-grid">${factorRows}</div>
      ${pairRows ? `<div class="pair-section">${pairRows}</div>` : ''}
    </div>` : ''}

    ${gateHtml ? `<div class="gate-section">${gateHtml}</div>` : ''}
  </div>`;
}

function renderDBB(dbb) {
  const el = document.getElementById('dbb-panel');
  const s = dbb.summary || {};
  const candidates = dbb.candidates || [];
  if (!s.total && !candidates.length) {
    el.innerHTML = '<div class="empty">No DBB candidates yet — collecting data</div>';
    return;
  }

  let html = '<div class="ex-health">';
  html += `<div class="ex-hl"><div class="hl-dot ${s.approved > 0 ? 'hl-green' : 'hl-yellow'}"></div><div class="hl-info"><span class="hl-title">APPROVED</span><span class="hl-val">${s.approved || 0}</span></div></div>`;
  html += `<div class="ex-hl"><div class="hl-dot hl-yellow"></div><div class="hl-info"><span class="hl-title">REJECTED</span><span class="hl-val">${s.rejected || 0}</span></div></div>`;
  html += `<div class="ex-hl"><div class="hl-dot hl-red"></div><div class="hl-info"><span class="hl-title">BLOCKED</span><span class="hl-val">${s.blocked || 0}</span></div></div>`;
  html += '</div>';

  html += '<div class="ex-metrics">';
  html += `<div class="m"><label>TOTAL</label><span class="v">${s.total || 0}</span></div>`;
  html += `<div class="m"><label>BREAKOUTS</label><span class="v">${s.breakouts || 0}</span></div>`;
  html += `<div class="m"><label>PULLBACKS</label><span class="v">${s.pullbacks || 0}</span></div>`;
  html += `<div class="m"><label>AVG BASE</label><span class="v">${s.avg_base_score || 0}</span></div>`;
  html += `<div class="m"><label>AVG FINAL</label><span class="v">${s.avg_final_score || 0}</span></div>`;
  html += '</div>';

  // Session breakdown
  const sess = s.by_session || {};
  const sessKeys = Object.keys(sess);
  if (sessKeys.length) {
    html += '<div class="ex-block-reasons"><h3>BY SESSION</h3><div class="br-grid">';
    for (const k of sessKeys) html += `<div class="br-row"><span class="br-name">${k}</span><span class="br-count">${sess[k]}</span></div>`;
    html += '</div></div>';
  }

  // Age breakdown
  const age = s.by_age || {};
  const ageKeys = Object.keys(age);
  if (ageKeys.length) {
    html += '<div class="ex-block-reasons"><h3>BY BOX AGE</h3><div class="br-grid">';
    for (const k of ageKeys) html += `<div class="br-row"><span class="br-name">${k}</span><span class="br-count">${age[k]}</span></div>`;
    html += '</div></div>';
  }

  // Candidate table
  html += '<div class="ex-timeline"><h3>DBB CANDIDATES</h3><div class="tl-scroll"><table style="width:100%;font-size:11px;border-collapse:collapse">';
  html += '<tr style="color:#556"><th>Time</th><th>Pair</th><th>Dir</th><th>Mode</th><th>BB</th><th>Base</th><th>Final</th><th>Tier</th><th>R:R</th><th>Session</th></tr>';

  const reversed = [...candidates].reverse();
  for (const c of reversed) {
    const ts = c.timestamp ? new Date(c.timestamp * 1000).toLocaleTimeString() : '';
    const tierCls = c.tier === 'A' || c.tier === 'B' ? 'pos' : c.tier === 'BLOCKED' ? 'neg' : '';
    html += `<tr style="border-bottom:1px solid #1a2030">`;
    html += `<td style="color:#556;font-family:monospace">${ts}</td>`;
    html += `<td style="color:#aab;font-weight:600">${(c.symbol||'').replace('_','/')}</td>`;
    html += `<td>${c.direction||''}</td>`;
    html += `<td>${(c.entry_type||'').replace('DBB_','')}</td>`;
    html += `<td style="font-size:10px">${c.bb_state||''}</td>`;
    html += `<td>${c.base_score||0}</td>`;
    html += `<td>${c.final_score||0}</td>`;
    html += `<td class="${tierCls}">${c.tier||''}</td>`;
    html += `<td>${c.rr||0}</td>`;
    html += `<td style="font-size:10px">${c.session||''}</td>`;
    html += `</tr>`;
  }
  html += '</table></div></div>';

  el.innerHTML = html;
}

function renderExecution(ex) {
  const el = document.getElementById('execution-panel');
  const s = ex.summary || {};
  const events = ex.events || [];
  if (!s.total && !events.length) {
    el.innerHTML = '<div class="empty">No execution data yet</div>';
    return;
  }

  const moves = s.moves || 0;
  const blocks = s.blocks || 0;
  const holds = s.holds || 0;
  const harvests = s.harvests || 0;
  const exits = s.exits || 0;
  const eff = s.sl_efficiency_pct || 0;
  const blockReasons = s.block_reasons || {};

  // Health lights
  const slHealth = eff >= 70 ? 'hl-green' : eff >= 50 ? 'hl-yellow' : 'hl-red';
  const slLabel = eff >= 70 ? 'HEALTHY' : eff >= 50 ? 'DEGRADED' : 'POOR';
  const spreadRisk = blocks > moves ? 'hl-red' : blocks > moves * 0.3 ? 'hl-yellow' : 'hl-green';
  const spreadLabel = blocks > moves ? 'HIGH' : blocks > moves * 0.3 ? 'ELEVATED' : 'NORMAL';
  const stepBlocks = blockReasons['step_too_small'] || 0;
  const ratchetEff = stepBlocks > moves * 0.5 ? 'hl-red' : stepBlocks > moves * 0.2 ? 'hl-yellow' : 'hl-green';
  const ratchetLabel = stepBlocks > moves * 0.5 ? 'THRASHING' : stepBlocks > moves * 0.2 ? 'NOISY' : 'EFFICIENT';

  // Health row
  let html = `<div class="ex-health">
    <div class="ex-hl"><div class="hl-dot ${slHealth}"></div><div class="hl-info"><span class="hl-title">SL ENGINE</span><span class="hl-val">${slLabel} (${eff}%)</span></div></div>
    <div class="ex-hl"><div class="hl-dot ${spreadRisk}"></div><div class="hl-info"><span class="hl-title">SPREAD RISK</span><span class="hl-val">${spreadLabel}</span></div></div>
    <div class="ex-hl"><div class="hl-dot ${ratchetEff}"></div><div class="hl-info"><span class="hl-title">RATCHET</span><span class="hl-val">${ratchetLabel}</span></div></div>
  </div>`;

  // Metrics row
  html += `<div class="ex-metrics">
    <div class="m"><label>SL MOVES</label><span class="v pos">${moves}</span></div>
    <div class="m"><label>SL BLOCKED</label><span class="v neg">${blocks}</span></div>
    <div class="m"><label>HOLDS</label><span class="v">${holds}</span></div>
    <div class="m"><label>HARVESTS</label><span class="v pos">${harvests}</span></div>
    <div class="m"><label>EXITS</label><span class="v">${exits}</span></div>
    <div class="m"><label>AVG SPREAD (BLOCK)</label><span class="v">${(s.avg_spread_at_block||0).toFixed(5)}</span></div>
    <div class="m"><label>AVG SPREAD (MOVE)</label><span class="v">${(s.avg_spread_at_move||0).toFixed(5)}</span></div>
  </div>`;

  // Block reasons
  const brKeys = Object.keys(blockReasons);
  if (brKeys.length) {
    html += '<div class="ex-block-reasons"><h3>BLOCK REASONS</h3><div class="br-grid">';
    brKeys.sort((a,b) => blockReasons[b] - blockReasons[a]);
    for (const k of brKeys) {
      html += `<div class="br-row"><span class="br-name">${k}</span><span class="br-count">${blockReasons[k]}</span></div>`;
    }
    html += '</div></div>';
  }

  // Event timeline
  html += '<div class="ex-timeline"><h3>EVENT TIMELINE</h3><div class="tl-scroll">';
  const reversed = [...events].reverse();
  for (const e of reversed) {
    const ts = e.timestamp ? new Date(e.timestamp * 1000).toLocaleTimeString() : '';
    let icon = '', cls = '';
    if (e.type === 'sl_moved') { icon = '+'; cls = 'tl-move'; }
    else if (e.type === 'sl_blocked') { icon = 'x'; cls = 'tl-block'; }
    else if (e.type === 'harvest') { icon = '$'; cls = 'tl-harvest'; }
    else if (e.type === 'hold') { icon = '-'; cls = 'tl-hold'; }
    else if (e.type === 'favorable_exit' || e.type === 'emergency_close') { icon = '!'; cls = 'tl-exit'; }
    else { icon = '?'; cls = 'tl-hold'; }

    const sym = e.symbol ? e.symbol.replace('_','/') : '';
    const pr = e.profit_r ? ` R:${e.profit_r.toFixed(2)}` : '';
    const detail = e.type === 'sl_moved' ? ` ${(e.old_sl||0).toFixed(5)} -> ${(e.new_sl||0).toFixed(5)}` :
                   e.type === 'sl_blocked' ? ` spread:${(e.spread||0).toFixed(5)}` : '';

    html += `<div class="tl-row ${cls}"><span class="tl-icon">${icon}</span><span class="tl-ts">${ts}</span><span class="tl-sym">${sym}</span><span class="tl-type">${e.type}</span><span class="tl-reason">${e.reason||''}${pr}${detail}</span></div>`;
  }
  html += '</div></div>';

  el.innerHTML = html;
}

document.querySelector('.tab-bar').addEventListener('click', e => {
  if (e.target.classList.contains('tab')) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    const tab = e.target.dataset.tab;
    document.getElementById('signals-grid').style.display = tab === 'signals' ? '' : 'none';
    document.getElementById('execution-panel').style.display = tab === 'execution' ? '' : 'none';
    document.getElementById('dbb-panel').style.display = tab === 'dbb' ? '' : 'none';
  }
});

load();
setInterval(load, 4000);
</script>
</body>
</html>
