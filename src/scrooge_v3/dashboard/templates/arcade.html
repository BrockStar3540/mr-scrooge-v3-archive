<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Scrooge Orchard</title>
<style>
  html,body{margin:0;height:100%;background:#070b14;overflow:hidden;font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#cfe3f5}
  #c{position:fixed;inset:0;display:block}
  #hud{position:fixed;top:0;left:0;right:0;padding:10px 16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
  .title{font-weight:800;letter-spacing:2px;font-size:18px;color:#ffce4d;text-shadow:0 0 12px rgba(255,206,77,.4)}
  .sub{font-size:11px;color:#6e8298;letter-spacing:1px}
  .brains{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .bchip{font-size:10px;padding:2px 7px;border-radius:9px;font-weight:700;color:#fff}
  .live{background:#1F6F3D}.armed{background:#2563eb}.parked{background:#555}
  .navbox{text-align:right}
  .nav{font-size:26px;font-weight:800;color:#3fb950;font-variant-numeric:tabular-nums}
  .navd{font-size:12px;font-variant-numeric:tabular-nums}
  .legend{position:fixed;bottom:8px;left:16px;font-size:10px;color:#5d7286;z-index:5;line-height:1.6}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div>
    <div class="title">🌳 THE SCROOGE ORCHARD</div>
    <div class="sub">ticks rain · the gate sieves · trades grow as trees · the brain harvests the fruit</div>
    <div class="brains" id="brains"></div>
  </div>
  <div class="navbox">
    <div class="nav" id="nav">$—</div>
    <div class="navd" id="navd"></div>
    <div class="sub" id="openinfo"></div>
  </div>
</div>
<div class="legend">
  💧 tick-rain &nbsp;·&nbsp; 🌳 a live trade (height = uPL) &nbsp;·&nbsp; 🟢 ripe fruit = pips &nbsp;·&nbsp; harvest → the bin (NAV) &nbsp;·&nbsp; data: /api/brain (3s)
</div>
<script>
const BASE=location.protocol+'//'+location.host;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;}rs();onresize=rs;
const PAIRCOL={AUD_USD:'#39c5ff',EUR_USD:'#7c5cff',GBP_USD:'#ff5ca8',USD_CAD:'#ffb14d'};
const C={win:'#3fb950',loss:'#f85149',gold:'#ffce4d',brain:'#b18cff',water:'#39c5ff',leaf:'#2f9e44',trunk:'#6b4a2b'};
let DATA={funnel:{},factor_state:[],exit_brain:[],exit_feed:[],account:{}};
let drops=[],fruits=[],coins=[],trees=[];
let vault={fill:.25,tgt:.25},brainPulse=0,brainMsg='',brainMsgT=0;
let lastNav=null,lastKey=null,baseNav=null;
function rnd(a,b){return a+Math.random()*(b-a);}
const Y=f=>f*H;
function spoutX(i,n){return W*0.5+(i-(n-1)/2)*Math.min(150,W*0.13);}
function funnel(){return{cx:W*0.5,top:Y(.165),bot:Y(.31),wTop:Math.min(360,W*.42),wBot:60};}
function orchard(){return{x0:W*0.5-Math.min(420,W*.45),x1:W*0.5-Math.min(420,W*.45)+Math.min(840,W*.9),top:Y(.40),ground:Y(.82)};}
function vaultRect(){const w=Math.min(220,W*.2),h=Y(.16);return{x:W-w-36,y:H-h-22,w,h};}
const brainY=()=>Y(.355);

async function fetchData(){
  try{
    const r=await fetch(BASE+'/api/brain');if(!r.ok)return;const d=await r.json();DATA=d;syncTrees();
    const a=d.account||{},nav=a.nav;
    if(nav!=null){if(baseNav==null)baseNav=nav;
      vault.tgt=Math.max(.06,Math.min(.96,(nav-(baseNav-2500))/5000));
      if(lastNav!=null){const dg=nav-lastNav;
        if(dg>0.4)harvest('win',Math.min(40,Math.ceil(dg/2)));
        else if(dg<-0.4)harvest('loss',Math.min(40,Math.ceil(-dg/2)));}
      lastNav=nav;}
    const f=d.exit_feed||[];
    if(f.length){const top=f[0],k=top.t+top.trade;if(k!==lastKey){lastKey=k;
      brainMsg=(top.action||'')+(top.trade?' '+top.trade:'');brainMsgT=1;brainPulse=1;
      if(top.action==='TAKE')harvest('win',5);}}
    renderHUD();
  }catch(e){}
}
function renderHUD(){
  const a=DATA.account||{},b=DATA.brains||{};
  document.getElementById('nav').textContent=a.nav!=null?'$'+a.nav.toLocaleString(undefined,{maximumFractionDigits:0}):'$—';
  if(a.nav!=null&&baseNav!=null){const d=a.nav-baseNav,el=document.getElementById('navd');
    el.textContent=(d>=0?'▲ +':'▼ ')+d.toFixed(0)+' since open';el.style.color=d>=0?'#3fb950':'#f85149';}
  document.getElementById('openinfo').textContent=a.open!=null?a.open+' trees · margin $'+(a.margin_used||0).toFixed(0):'';
  const bn=document.getElementById('brains'),sc=s=>s==='live'?'live':(s==='armed'?'armed':'parked');
  bn.innerHTML=`<span class="bchip ${sc(b.entry_ev)}">EV ENTRY</span><span class="bchip ${sc(b.adr_tp)}">ADR-TP</span><span class="bchip ${sc(b.exit_brain)}">EXIT BRAIN</span><span class="bchip ${sc(b.sizing)}">SIZING</span>`;
}
setInterval(fetchData,3000);fetchData();

function syncTrees(){
  const pos=(DATA.exit_brain||[]).slice(0,8),byId={};trees.forEach(t=>byId[t.id]=t);const next=[];
  pos.forEach(p=>{let t=byId[p.id]||{id:p.id,growth:.1,fruit:0,sway:Math.random()*6.28};
    t.pair=p.pair;t.dir=p.dir;t.upl=p.upl;t.brain=p.brain;
    t.gTarget=Math.max(.12,Math.min(1,.42+(p.upl/220)));
    t.fTarget=Math.max(0,Math.min(10,(p.upl||0)/13));next.push(t);});
  trees=next;
}
function spawnDrop(){
  const fs=DATA.factor_state||[],n=Math.max(1,fs.length),i=Math.floor(Math.random()*n),f=fs[i]||{};
  drops.push({x:spoutX(i,n)+rnd(-6,6),y:Y(.10),vx:rnd(-.3,.3),vy:rnd(.5,1.2),col:PAIRCOL[f.pair]||C.water,st:'fall',life:0,r:rnd(2,3.6)});
}
function harvest(kind,n){
  const ord=orchard();
  const ripe=trees.filter(t=>t.fruit>0.5);
  for(let i=0;i<n;i++){
    const t=kind==='win'&&ripe.length?ripe[Math.floor(Math.random()*ripe.length)]:(trees.length?trees[Math.floor(Math.random()*trees.length)]:null);
    const cy=t?ord.ground-(ord.ground-ord.top)*t.growth:ord.top;
    const tx=t?t.x:ord.x1;
    fruits.push({x:tx+rnd(-22,22),y:cy+rnd(-12,8),vx:rnd(.7,1.5),vy:rnd(.2,1),kind,col:kind==='win'?C.win:C.loss,ph:Math.random()*6.28,life:0,st:kind==='win'?'fall':'doom'});
    if(t&&kind==='win')t.fruit=Math.max(0,t.fruit-0.6);
  }
}
function update(dt){
  const fs=DATA.factor_state||[];let pressure=2+fs.reduce((s,f)=>s+(f.align||0),0);
  if(Math.random()<Math.min(.9,pressure*0.06))spawnDrop();
  const fn=funnel(),rj=DATA.funnel||{},ord=orchard(),vr=vaultRect();
  const totRej=(rj.below_floor||0)+(rj.adr||0)+(rj.ev_veto||0)+(rj.cooldown||0)+(rj.other||0);
  const passFrac=Math.max(.03,Math.min(.4,(rj.passed||1)/((rj.passed||1)+totRej)));
  for(const d of drops){d.life+=dt;
    if(d.st==='fall'){d.vy+=.06;d.y+=d.vy;d.x+=d.vx;
      if(d.y>=fn.bot-4&&d.y<fn.bot+10){if(Math.random()<passFrac){d.st='pass';d.x=fn.cx+rnd(-16,16);d.vy=rnd(1.5,2.5);}else{d.st='reject';d.vx=(d.x<fn.cx?-1:1)*rnd(1.5,3);d.vy=rnd(-1,.4);}}}
    else if(d.st==='reject'){d.vy+=.16;d.x+=d.vx;d.y+=d.vy;}
    else if(d.st==='pass'){d.vy+=.10;d.y+=d.vy;d.x+=d.vx;if(d.y>=ord.ground-4)d.st='dead';}}
  drops=drops.filter(d=>d.y<H+20&&d.st!=='dead'&&d.life<14);if(drops.length>520)drops.splice(0,drops.length-520);
  trees.forEach((t,i)=>{t.growth+=(t.gTarget-t.growth)*.03;t.fruit+=(t.fTarget-t.fruit)*.04;t.sway+=.012;
    t.x=ord.x0+(ord.x1-ord.x0)*((i+0.5)/Math.max(1,trees.length));});
  for(const l of fruits){l.life+=dt;l.ph+=.25;
    if(l.st==='fall'){l.vy+=.35;l.y+=l.vy;l.x+=l.vx*.3;if(l.y>=ord.ground-4){l.y=ord.ground-4;l.st='march';}}
    else if(l.st==='march'){l.x+=l.vx;l.y=ord.ground-4+Math.sin(l.ph)*1.6;if(l.x>=vr.x+vr.w*.5){l.st='dive';l.vy=1;coins.push({x:l.x,y:l.y,vy:1,t:0});}}
    else if(l.st==='dive'){l.vy+=.4;l.y+=l.vy;if(l.y>vr.y+vr.h*(1-vault.fill))l.st='dead';}
    else if(l.st==='doom'){l.vy+=.35;l.y+=l.vy;l.x+=l.vx*.5;if(l.y>H+20)l.st='dead';}}
  fruits=fruits.filter(l=>l.st!=='dead'&&l.life<22);if(fruits.length>150)fruits.splice(0,fruits.length-150);
  coins=coins.filter(c=>(c.t+=dt)<.6);for(const c of coins)c.y+=c.vy;
  vault.fill+=(vault.tgt-vault.fill)*.04;
  if(brainPulse>0)brainPulse-=dt*1.6;if(brainMsgT>0)brainMsgT-=dt*.5;
}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawBG(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a1424');g.addColorStop(.55,'#0a1018');g.addColorStop(1,'#05080f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const ord=orchard();ctx.fillStyle='#13261a';ctx.fillRect(0,ord.ground,W,H-ord.ground);ctx.fillStyle='#1d3a22';ctx.fillRect(0,ord.ground-3,W,4);}
function drawSpouts(){const fs=DATA.factor_state||[],n=Math.max(1,fs.length);
  for(let i=0;i<n;i++){const f=fs[i]||{},x=spoutX(i,n),col=PAIRCOL[f.pair]||C.water;
    ctx.fillStyle='#2a3a4f';ctx.beginPath();ctx.ellipse(x,Y(.07),34,12,0,0,7);ctx.fill();
    ctx.fillStyle='#9fb4cc';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText((f.pair||'').replace('_','/'),x,Y(.07)-16);
    const al=f.align||0;for(let d=0;d<4;d++){ctx.fillStyle=d<al?col:'#33445a';ctx.beginPath();ctx.arc(x-13+d*9,Y(.07),2.6,0,7);ctx.fill();}
    ctx.fillStyle=(f.adr&&+f.adr.replace('ADR','')>=4)?C.gold:'#5d7286';ctx.font='9px monospace';ctx.fillText(f.adr||'',x,Y(.07)+22);}}
function drawFunnel(){const fn=funnel();ctx.strokeStyle='#3b5a82';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(fn.cx-fn.wTop/2,fn.top);ctx.lineTo(fn.cx-fn.wBot/2,fn.bot);ctx.moveTo(fn.cx+fn.wTop/2,fn.top);ctx.lineTo(fn.cx+fn.wBot/2,fn.bot);ctx.stroke();
  const lbl=['align','ADR','+1.25 floor','EV model'];ctx.textAlign='center';
  for(let i=0;i<4;i++){const yy=fn.top+(i+1)*(fn.bot-fn.top)/5,wf=fn.wTop/2-(fn.wTop-fn.wBot)/2*((yy-fn.top)/(fn.bot-fn.top));
    ctx.strokeStyle='rgba(120,150,190,.22)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(fn.cx-wf,yy);ctx.lineTo(fn.cx+wf,yy);ctx.stroke();
    ctx.fillStyle='#56708e';ctx.font='10px monospace';ctx.fillText(lbl[i],fn.cx,yy-3);}
  const rj=DATA.funnel||{},items=[['floor',rj.below_floor||0],['ADR',rj.adr||0],['EV veto',rj.ev_veto||0],['other',rj.other||0]];
  ctx.textAlign='right';ctx.fillStyle='#42566f';ctx.font='10px monospace';
  items.forEach((it,k)=>ctx.fillText('◄ '+it[0]+': '+it[1],fn.cx-fn.wTop/2-14,fn.top+10+k*15));
  ctx.textAlign='left';ctx.fillStyle=C.win;ctx.font='bold 11px monospace';ctx.fillText('PASSED '+(rj.passed||0)+' ►',fn.cx+fn.wTop/2+14,fn.top+12);
  ctx.fillStyle='#9fb4cc';ctx.font='10px monospace';ctx.fillText('avg +'+(DATA.funnel_pass_ev_avg!=null?DATA.funnel_pass_ev_avg:'—')+'p',fn.cx+fn.wTop/2+14,fn.top+28);
  ctx.textAlign='center';ctx.fillStyle=C.gold;ctx.font='bold 11px monospace';ctx.fillText('⚙ THE GATE',fn.cx,fn.top-8);}
function drawTree(t){const ord=orchard(),base=ord.ground,h=(base-ord.top)*t.growth,x=t.x,sway=Math.sin(t.sway)*4*t.growth,up=t.upl>=0;
  ctx.strokeStyle=C.trunk;ctx.lineWidth=Math.max(3,9*t.growth);ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x,base);ctx.quadraticCurveTo(x+sway*.4,base-h*.5,x+sway,base-h);ctx.stroke();
  const cy=base-h,cr=16+36*t.growth;ctx.fillStyle=up?'#2f9e44':'#7d6a2c';
  for(const o of [[0,0,1],[-.62,.18,.72],[.62,.18,.72],[-.2,-.5,.66],[.3,-.42,.6]]){ctx.beginPath();ctx.arc(x+sway+o[0]*cr,cy+o[1]*cr,cr*o[2],0,7);ctx.fill();}
  const act=t.brain&&t.brain.action;
  if(act==='RIDE'){ctx.strokeStyle=C.win;ctx.globalAlpha=.45+Math.sin(performance.now()*.006)*.3;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+sway,cy,cr+7,0,7);ctx.stroke();ctx.globalAlpha=1;}
  else if(act==='TAKE'){ctx.strokeStyle=C.gold;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+sway,cy,cr+7,0,7);ctx.stroke();}
  const nf=Math.floor(t.fruit);for(let i=0;i<nf;i++){const a=i*2.39+t.sway*.2,fx=x+sway+Math.cos(a)*cr*.72,fy=cy+Math.sin(a)*cr*.6;
    ctx.fillStyle=up?C.win:C.loss;ctx.beginPath();ctx.arc(fx,fy,3.6,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.globalAlpha=.5;ctx.beginPath();ctx.arc(fx-1,fy-1,1.2,0,7);ctx.fill();ctx.globalAlpha=1;}
  ctx.fillStyle='#9fb4cc';ctx.font='9px monospace';ctx.textAlign='center';ctx.fillText((t.pair||'').replace('_','/'),x,base+13);
  ctx.fillStyle=up?C.win:C.loss;ctx.fillText((up?'+':'')+'$'+(t.upl||0).toFixed(0),x,base+24);}
function drawOrchard(){if(!trees.length){const ord=orchard();ctx.fillStyle='#3a5544';ctx.font='13px monospace';ctx.textAlign='center';ctx.fillText('🌱 the orchard is bare — no open trades',W*.5,(ord.top+ord.ground)/2);return;}
  trees.slice().sort((a,b)=>a.growth-b.growth).forEach(drawTree);}
function drawBrain(){const x=W*.5,y=brainY(),r=24+Math.sin(performance.now()*.004)*2+brainPulse*8;
  const g=ctx.createRadialGradient(x,y,4,x,y,r+10);g.addColorStop(0,'#d8c4ff');g.addColorStop(1,'rgba(177,140,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r+10,0,7);ctx.fill();
  ctx.fillStyle=C.brain;ctx.beginPath();ctx.arc(x,y,r*.6,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-6,y-2,3,0,7);ctx.arc(x+6,y-2,3,0,7);ctx.fill();
  ctx.fillStyle='#241038';ctx.beginPath();ctx.arc(x-6,y-1,1.4,0,7);ctx.arc(x+6,y-1,1.4,0,7);ctx.fill();
  ctx.fillStyle='#cdb6ff';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText('🧠 EXIT BRAIN (the gardener)',x,y-r-7);
  if(brainMsgT>0){ctx.globalAlpha=Math.min(1,brainMsgT*2);ctx.fillStyle=brainMsg.startsWith('RIDE')?C.win:C.gold;ctx.font='bold 13px monospace';ctx.fillText(brainMsg,x,y+r+16);ctx.globalAlpha=1;}}
function drawFruit(l){ctx.save();ctx.translate(l.x,l.y);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,6,5,2,0,0,7);ctx.fill();
  ctx.fillStyle=l.col;ctx.beginPath();ctx.arc(0,0,5,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.globalAlpha=.55;ctx.beginPath();ctx.arc(-1.5,-1.5,1.4,0,7);ctx.fill();ctx.globalAlpha=1;
  ctx.strokeStyle='#1d3a22';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(0,-5);ctx.lineTo(1,-8);ctx.stroke();
  ctx.fillStyle=C.leaf;ctx.beginPath();ctx.ellipse(3,-7,3,1.5,.6,0,7);ctx.fill();
  if(l.st==='march'){ctx.fillStyle='#0c1320';const lg=Math.sin(l.ph)*1.6;ctx.fillRect(-2.4,4,1.5,2.4+lg);ctx.fillRect(1,4,1.5,2.4-lg);
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(2,-1,1.2,0,7);ctx.fill();ctx.fillStyle='#08101c';ctx.beginPath();ctx.arc(2.4,-1,.6,0,7);ctx.fill();}
  ctx.restore();}
function drawVault(){const vr=vaultRect();ctx.fillStyle='#11202e';rrect(vr.x,vr.y,vr.w,vr.h,10);ctx.fill();
  const fh=vr.h*vault.fill,gg=ctx.createLinearGradient(0,vr.y+vr.h-fh,0,vr.y+vr.h);gg.addColorStop(0,'#ffe28a');gg.addColorStop(1,'#d99a1e');ctx.fillStyle=gg;rrect(vr.x+4,vr.y+vr.h-fh+2,vr.w-8,fh-4,8);ctx.fill();
  for(let i=0;i<6;i++){const cx=vr.x+12+((i*53+performance.now()*.02)%(vr.w-24));ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.arc(cx,vr.y+vr.h-fh+8+(i%2)*6,1.5,0,7);ctx.fill();}
  ctx.strokeStyle='#ffce4d';ctx.lineWidth=2;rrect(vr.x,vr.y,vr.w,vr.h,10);ctx.stroke();ctx.lineWidth=1;
  ctx.fillStyle='#ffce4d';ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.fillText('💰 SCROOGE’S BIN',vr.x+vr.w/2,vr.y-8);
  const a=DATA.account||{};ctx.fillStyle='#08101c';ctx.font='bold 15px monospace';ctx.fillText(a.balance!=null?'$'+a.balance.toLocaleString(undefined,{maximumFractionDigits:0}):'$—',vr.x+vr.w/2,vr.y+vr.h-8);
  for(const c of coins){ctx.fillStyle='#ffce4d';ctx.globalAlpha=1-c.t/.6;ctx.beginPath();ctx.arc(c.x,c.y,2,0,7);ctx.fill();ctx.globalAlpha=1;}}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);
  drawBG();drawFunnel();drawSpouts();
  for(const d of drops){ctx.globalAlpha=d.st==='reject'?.5:.85;ctx.fillStyle=d.col;ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,7);ctx.fill();}ctx.globalAlpha=1;
  drawBrain();drawOrchard();for(const l of fruits)drawFruit(l);drawVault();
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
</body></html>
