<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Scrooge Machine</title>
<style>
  html,body{margin:0;height:100%;background:#070b14;overflow:hidden;font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#cfe3f5}
  #c{position:fixed;inset:0;display:block}
  #hud{position:fixed;top:0;left:0;right:0;padding:9px 16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
  .title{font-weight:800;letter-spacing:2px;font-size:17px;color:#ffce4d;text-shadow:0 0 12px rgba(255,206,77,.4)}
  .sub{font-size:11px;color:#6e8298;letter-spacing:.5px}
  .brains{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
  .bchip{font-size:10px;padding:2px 7px;border-radius:9px;font-weight:700;color:#fff}
  .live{background:#1F6F3D}.armed{background:#2563eb}.parked{background:#555}
  .navbox{text-align:right}.nav{font-size:24px;font-weight:800;color:#3fb950;font-variant-numeric:tabular-nums}
  .navd{font-size:12px}.legend{position:fixed;bottom:7px;left:16px;font-size:10px;color:#5d7286;z-index:5}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div><div class="title">⚙ THE SCROOGE MACHINE</div>
    <div class="sub">a tick's journey: feed → features → strategies → the gate → rank → size → execute → grow → harvest</div>
    <div class="brains" id="brains"></div></div>
  <div class="navbox"><div class="nav" id="nav">$—</div><div class="navd" id="navd"></div><div class="sub" id="openinfo"></div></div>
</div>
<div class="legend">● candidate flowing the line &nbsp;·&nbsp; ✕ killed at a gate &nbsp;·&nbsp; 🌳 survivor = a live trade &nbsp;·&nbsp; 🍎 pip → bin &nbsp;·&nbsp; all live /api/brain (3s)</div>
<script>
const BASE=location.protocol+'//'+location.host;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;}rs();onresize=rs;
const PAIRCOL={AUD_USD:'#39c5ff',EUR_USD:'#7c5cff',GBP_USD:'#ff5ca8',USD_CAD:'#ffb14d'};
const C={win:'#3fb950',loss:'#f85149',gold:'#ffce4d',brain:'#b18cff',ml:'#b18cff',gate:'#d2763a',leaf:'#2f9e44',trunk:'#6b4a2b'};
// stations: normalized layout, in process order
const NS=[
 {nx:.06,ny:.155,l:'MARKET FEED',k:'feed'},
 {nx:.215,ny:.155,l:'FEATURE MILL',k:'mill'},
 {nx:.37,ny:.155,l:'STRATEGY FORGE',k:'forge'},
 {nx:.55,ny:.155,l:'ALIGN GATE',k:'gate',rk:'other'},
 {nx:.72,ny:.155,l:'ADR GATE',k:'gate',rk:'adr'},
 {nx:.885,ny:.30,l:'+1.25 FLOOR',k:'gate',rk:'below_floor'},
 {nx:.70,ny:.30,l:'EV MODEL',k:'gate',rk:'ev_veto',ml:1},
 {nx:.515,ny:.30,l:'RANKER',k:'rank'},
 {nx:.33,ny:.30,l:'SIZER',k:'size'},
 {nx:.155,ny:.30,l:'EXECUTE',k:'plant'},
];
let DATA={funnel:{},factor_state:[],exit_brain:[],exit_feed:[],strategies:{fires:[],tally:{}},sizing:null,account:{}};
let tokens=[],drops=[],fruits=[],coins=[],trees=[],glow=new Array(NS.length).fill(0);
let vault={fill:.25,tgt:.25},brainPulse=0,brainMsg='',brainMsgT=0;
let lastNav=null,lastKey=null,baseNav=null,forgeIdx=0,sizeFlash=0;
const rnd=(a,b)=>a+Math.random()*(b-a);
function SP(i){return{x:NS[i].nx*W,y:NS[i].ny*H};}
function orchard(){return{x0:W*.10,x1:W*.78,top:H*.46,ground:H*.85};}
function vaultRect(){const w=Math.min(200,W*.18),h=H*.15;return{x:W-w-30,y:H-h-18,w,h};}
const brainY=()=>H*.41;

async function fetchData(){try{
  const r=await fetch(BASE+'/api/brain');if(!r.ok)return;DATA=await r.json();syncTrees();
  const a=DATA.account||{},nav=a.nav;
  if(nav!=null){if(baseNav==null)baseNav=nav;vault.tgt=Math.max(.06,Math.min(.96,(nav-(baseNav-2500))/5000));
    if(lastNav!=null){const dg=nav-lastNav;if(dg>.4)harvest('win',Math.min(40,Math.ceil(dg/2)));else if(dg<-.4)harvest('loss',Math.min(40,Math.ceil(-dg/2)));}lastNav=nav;}
  const f=DATA.exit_feed||[];if(f.length){const top=f[0],k=top.t+top.trade;if(k!==lastKey){lastKey=k;brainMsg=(top.action||'')+(top.trade?' '+top.trade:'');brainMsgT=1;brainPulse=1;if(top.action==='TAKE')harvest('win',5);}}
  renderHUD();
}catch(e){}}
function renderHUD(){const a=DATA.account||{},b=DATA.brains||{};
  document.getElementById('nav').textContent=a.nav!=null?'$'+a.nav.toLocaleString(undefined,{maximumFractionDigits:0}):'$—';
  if(a.nav!=null&&baseNav!=null){const d=a.nav-baseNav,el=document.getElementById('navd');el.textContent=(d>=0?'▲ +':'▼ ')+d.toFixed(0)+' since open';el.style.color=d>=0?'#3fb950':'#f85149';}
  document.getElementById('openinfo').textContent=a.open!=null?a.open+' trees · margin $'+(a.margin_used||0).toFixed(0):'';
  const bn=document.getElementById('brains'),sc=s=>s==='live'?'live':(s==='armed'?'armed':'parked');
  bn.innerHTML=`<span class="bchip ${sc(b.entry_ev)}">EV ENTRY</span><span class="bchip ${sc(b.adr_tp)}">ADR-TP</span><span class="bchip ${sc(b.exit_brain)}">EXIT BRAIN</span><span class="bchip ${sc(b.sizing)}">SIZING</span>`;}
setInterval(fetchData,3000);fetchData();

function syncTrees(){const pos=(DATA.exit_brain||[]).slice(0,8),byId={};trees.forEach(t=>byId[t.id]=t);const nx=[];
  pos.forEach(p=>{let t=byId[p.id]||{id:p.id,growth:.1,fruit:0,sway:Math.random()*6.28};t.pair=p.pair;t.dir=p.dir;t.upl=p.upl;t.brain=p.brain;
    t.gTarget=Math.max(.12,Math.min(1,.42+(p.upl/220)));t.fTarget=Math.max(0,Math.min(10,(p.upl||0)/13));nx.push(t);});trees=nx;}
function pairWeighted(){const fs=DATA.factor_state||[];if(!fs.length)return{pair:'AUD_USD',col:C.win};
  const f=fs[Math.floor(Math.random()*fs.length)];return{pair:f.pair,col:PAIRCOL[f.pair]||'#8fd',al:f.align||0};}
function spawnToken(){const w=pairWeighted();tokens.push({from:0,to:1,p:0,col:w.col,pair:w.pair,strat:null,st:'go'});}
function gateDrop(rk){const fn=DATA.funnel||{};const tot=(fn.passed||0)+(fn.below_floor||0)+(fn.adr||0)+(fn.ev_veto||0)+(fn.cooldown||0)+(fn.other||0)||1;
  return Math.max(0,Math.min(.9,(fn[rk]||0)/tot));}
function harvest(kind,n){const ord=orchard();const ripe=trees.filter(t=>t.fruit>.5);
  for(let i=0;i<n;i++){const t=kind==='win'&&ripe.length?ripe[Math.floor(Math.random()*ripe.length)]:(trees.length?trees[Math.floor(Math.random()*trees.length)]:null);
    const cy=t?ord.ground-(ord.ground-ord.top)*t.growth:ord.top,tx=t?t.x:ord.x1;
    fruits.push({x:tx+rnd(-20,20),y:cy+rnd(-10,8),vx:rnd(.7,1.5),vy:rnd(.2,1),kind,col:kind==='win'?C.win:C.loss,ph:Math.random()*6.28,life:0,st:kind==='win'?'fall':'doom'});
    if(t&&kind==='win')t.fruit=Math.max(0,t.fruit-.6);}}
function update(dt){
  const fs=DATA.factor_state||[];let pressure=1.4+fs.reduce((s,f)=>s+(f.align||0),0)*.5;
  if(Math.random()<Math.min(.7,pressure*0.04))spawnToken();
  const ord=orchard(),vr=vaultRect();
  for(const k of tokens){
    if(k.st!=='go'){k.dy=(k.dy||0)+.4;k.y+=k.dy;k.x+=(k.dvx||0);continue;}
    const a=SP(k.from),b=SP(k.to);k.p+=dt*0.9;
    k.x=a.x+(b.x-a.x)*k.p;k.y=a.y+(b.y-a.y)*k.p;
    glow[k.to]=Math.min(1,glow[k.to]+0.04);
    if(k.p>=1){const st=NS[k.to];
      if(st.k==='forge'){const fr=(DATA.strategies&&DATA.strategies.fires)||[];if(fr.length){const s=fr[forgeIdx%fr.length];forgeIdx++;k.strat=s.s;k.pair=s.pair;k.col=PAIRCOL[s.pair]||k.col;}}
      if(st.k==='size')sizeFlash=1;
      if(st.k==='gate'&&Math.random()<gateDrop(st.rk)){k.st='drop';k.x=b.x;k.y=b.y;k.dy=0;k.dvx=rnd(-.6,.6);continue;}
      if(k.to>=NS.length-1){ // executed -> plant a seed pulse
        k.st='plant';k.x=b.x;k.y=b.y;k.dy=1;k.dvx=(W*.4-b.x)/120;continue;}
      k.from=k.to;k.to++;k.p=0;}
  }
  tokens=tokens.filter(k=>{if(k.st==='drop')return k.y<H+20;if(k.st==='plant')return k.y<ord.ground;return true;});
  if(tokens.length>120)tokens.splice(0,tokens.length-120);
  trees.forEach((t,i)=>{t.growth+=(t.gTarget-t.growth)*.03;t.fruit+=(t.fTarget-t.fruit)*.04;t.sway+=.012;t.x=ord.x0+(ord.x1-ord.x0)*((i+.5)/Math.max(1,trees.length));});
  for(const l of fruits){l.life+=dt;l.ph+=.25;
    if(l.st==='fall'){l.vy+=.35;l.y+=l.vy;l.x+=l.vx*.3;if(l.y>=ord.ground-4){l.y=ord.ground-4;l.st='march';}}
    else if(l.st==='march'){l.x+=l.vx;l.y=ord.ground-4+Math.sin(l.ph)*1.6;if(l.x>=vr.x+vr.w*.5){l.st='dive';l.vy=1;coins.push({x:l.x,y:l.y,vy:1,t:0});}}
    else if(l.st==='dive'){l.vy+=.4;l.y+=l.vy;if(l.y>vr.y+vr.h*(1-vault.fill))l.st='dead';}
    else if(l.st==='doom'){l.vy+=.35;l.y+=l.vy;l.x+=l.vx*.5;if(l.y>H+20)l.st='dead';}}
  fruits=fruits.filter(l=>l.st!=='dead'&&l.life<22);if(fruits.length>150)fruits.splice(0,fruits.length-150);
  coins=coins.filter(c=>(c.t+=dt)<.6);for(const c of coins)c.y+=c.vy;
  vault.fill+=(vault.tgt-vault.fill)*.04;
  for(let i=0;i<glow.length;i++)glow[i]=Math.max(0,glow[i]-dt*0.8);
  if(brainPulse>0)brainPulse-=dt*1.6;if(brainMsgT>0)brainMsgT-=dt*.5;if(sizeFlash>0)sizeFlash-=dt*1.5;
}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawBG(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a1424');g.addColorStop(.5,'#0a1018');g.addColorStop(1,'#05080f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const ord=orchard();ctx.fillStyle='#13261a';ctx.fillRect(0,ord.ground,W,H-ord.ground);ctx.fillStyle='#1d3a22';ctx.fillRect(0,ord.ground-3,W,4);}
function drawBelts(){ctx.lineCap='round';
  for(let i=0;i<NS.length-1;i++){const a=SP(i),b=SP(i+1);ctx.strokeStyle='#1d2b3e';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    ctx.strokeStyle='#28405c';ctx.lineWidth=2;ctx.setLineDash([3,7]);ctx.lineDashOffset=-performance.now()*0.04;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([]);}
  // execute -> orchard
  const e=SP(NS.length-1),ord=orchard();ctx.strokeStyle='#1d2b3e';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.x,ord.top);ctx.stroke();}
function statText(i){const s=NS[i],fn=DATA.funnel||{};
  if(s.k==='feed')return(DATA.factor_state||[]).length+' pairs';
  if(s.k==='mill')return'14 factors';
  if(s.k==='forge'){const ta=DATA.strategies&&DATA.strategies.tally||{};const ks=Object.keys(ta);return ks.length?ks[0].slice(0,11)+' ×'+ta[ks[0]]:'idle';}
  if(s.k==='gate')return'✕ '+(fn[s.rk]||0);
  if(s.k==='rank')return'PASSED '+(fn.passed||0);
  if(s.k==='size'){const z=DATA.sizing;return z?(z.units/1000).toFixed(0)+'k u':'1% risk';}
  if(s.k==='plant')return'🌱 plant';
  return'';}
function drawStation(i){const s=NS[i],p=SP(i),w=Math.min(118,W*.115),h=44,g=glow[i];
  ctx.fillStyle='#0d1826';rrect(p.x-w/2,p.y-h/2,w,h,8);ctx.fill();
  let edge=s.ml?C.ml:(s.k==='gate'?C.gate:(s.k==='plant'?C.win:(s.k==='feed'?'#39c5ff':'#33506f')));
  ctx.strokeStyle=edge;ctx.globalAlpha=.55+g*.45;ctx.lineWidth=1.4+g*2.5;rrect(p.x-w/2,p.y-h/2,w,h,8);ctx.stroke();ctx.globalAlpha=1;
  if(s.ml){ctx.globalAlpha=.25+g*.4;ctx.fillStyle=C.ml;rrect(p.x-w/2,p.y-h/2,w,h,8);ctx.fill();ctx.globalAlpha=1;}
  ctx.fillStyle='#dce8f5';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText((s.ml?'🤖 ':'')+s.l,p.x,p.y-3);
  ctx.fillStyle=s.k==='gate'?'#e08a5a':(s.k==='rank'?C.win:'#7d96b0');ctx.font='9px monospace';
  ctx.fillText((s.k==='size'&&sizeFlash>0?'▶ ':'')+statText(i),p.x,p.y+11);
  // mill lamps
  if(s.k==='mill'){for(let d=0;d<7;d++){ctx.fillStyle=(Math.sin(performance.now()*.005+d)>0?'#39c5ff':'#1b3147');ctx.beginPath();ctx.arc(p.x-w/2+10+d*14,p.y+h/2+5,2,0,7);ctx.fill();}}
  // gate drain bin w/ count
  if(s.k==='gate'){ctx.fillStyle='rgba(210,118,58,.15)';rrect(p.x-14,p.y+h/2+3,28,7,2);ctx.fill();}
}
function drawTree(t){const ord=orchard(),base=ord.ground,h=(base-ord.top)*t.growth,x=t.x,sway=Math.sin(t.sway)*4*t.growth,up=t.upl>=0;
  ctx.strokeStyle=C.trunk;ctx.lineWidth=Math.max(3,9*t.growth);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,base);ctx.quadraticCurveTo(x+sway*.4,base-h*.5,x+sway,base-h);ctx.stroke();
  const cy=base-h,cr=15+34*t.growth;ctx.fillStyle=up?'#2f9e44':'#7d6a2c';
  for(const o of [[0,0,1],[-.62,.18,.72],[.62,.18,.72],[-.2,-.5,.66],[.3,-.42,.6]])ctx.beginPath(),ctx.arc(x+sway+o[0]*cr,cy+o[1]*cr,cr*o[2],0,7),ctx.fill();
  const act=t.brain&&t.brain.action;
  if(act==='RIDE'){ctx.strokeStyle=C.win;ctx.globalAlpha=.45+Math.sin(performance.now()*.006)*.3;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+sway,cy,cr+7,0,7);ctx.stroke();ctx.globalAlpha=1;}
  else if(act==='TAKE'){ctx.strokeStyle=C.gold;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+sway,cy,cr+7,0,7);ctx.stroke();}
  const nf=Math.floor(t.fruit);for(let i=0;i<nf;i++){const a=i*2.39+t.sway*.2,fx=x+sway+Math.cos(a)*cr*.72,fy=cy+Math.sin(a)*cr*.6;
    ctx.fillStyle=up?C.win:C.loss;ctx.beginPath();ctx.arc(fx,fy,3.6,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.globalAlpha=.5;ctx.beginPath();ctx.arc(fx-1,fy-1,1.2,0,7);ctx.fill();ctx.globalAlpha=1;}
  ctx.fillStyle='#9fb4cc';ctx.font='9px monospace';ctx.textAlign='center';ctx.fillText((t.pair||'').replace('_','/'),x,base+13);
  ctx.fillStyle=up?C.win:C.loss;ctx.fillText((up?'+':'')+'$'+(t.upl||0).toFixed(0),x,base+24);}
function drawBrain(){const x=W*.5,y=brainY(),r=22+Math.sin(performance.now()*.004)*2+brainPulse*8;
  const g=ctx.createRadialGradient(x,y,4,x,y,r+10);g.addColorStop(0,'#d8c4ff');g.addColorStop(1,'rgba(177,140,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r+10,0,7);ctx.fill();
  ctx.fillStyle=C.brain;ctx.beginPath();ctx.arc(x,y,r*.6,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-5,y-2,2.6,0,7);ctx.arc(x+5,y-2,2.6,0,7);ctx.fill();
  ctx.fillStyle='#241038';ctx.beginPath();ctx.arc(x-5,y-1,1.2,0,7);ctx.arc(x+5,y-1,1.2,0,7);ctx.fill();
  ctx.fillStyle='#cdb6ff';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText('🧠 EXIT BRAIN — the gardener',x,y-r-6);
  if(brainMsgT>0){ctx.globalAlpha=Math.min(1,brainMsgT*2);ctx.fillStyle=brainMsg.startsWith('RIDE')?C.win:C.gold;ctx.font='bold 13px monospace';ctx.fillText(brainMsg,x,y+r+14);ctx.globalAlpha=1;}}
function drawFruit(l){ctx.save();ctx.translate(l.x,l.y);ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,6,5,2,0,0,7);ctx.fill();
  ctx.fillStyle=l.col;ctx.beginPath();ctx.arc(0,0,5,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.globalAlpha=.55;ctx.beginPath();ctx.arc(-1.5,-1.5,1.4,0,7);ctx.fill();ctx.globalAlpha=1;
  ctx.strokeStyle='#1d3a22';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(0,-5);ctx.lineTo(1,-8);ctx.stroke();ctx.fillStyle=C.leaf;ctx.beginPath();ctx.ellipse(3,-7,3,1.5,.6,0,7);ctx.fill();
  if(l.st==='march'){ctx.fillStyle='#0c1320';const lg=Math.sin(l.ph)*1.6;ctx.fillRect(-2.4,4,1.5,2.4+lg);ctx.fillRect(1,4,1.5,2.4-lg);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(2,-1,1.2,0,7);ctx.fill();ctx.fillStyle='#08101c';ctx.beginPath();ctx.arc(2.4,-1,.6,0,7);ctx.fill();}
  ctx.restore();}
function drawVault(){const vr=vaultRect();ctx.fillStyle='#11202e';rrect(vr.x,vr.y,vr.w,vr.h,10);ctx.fill();
  const fh=vr.h*vault.fill,gg=ctx.createLinearGradient(0,vr.y+vr.h-fh,0,vr.y+vr.h);gg.addColorStop(0,'#ffe28a');gg.addColorStop(1,'#d99a1e');ctx.fillStyle=gg;rrect(vr.x+4,vr.y+vr.h-fh+2,vr.w-8,fh-4,8);ctx.fill();
  ctx.strokeStyle='#ffce4d';ctx.lineWidth=2;rrect(vr.x,vr.y,vr.w,vr.h,10);ctx.stroke();ctx.lineWidth=1;
  ctx.fillStyle='#ffce4d';ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.fillText('💰 SCROOGE’S BIN',vr.x+vr.w/2,vr.y-8);
  const a=DATA.account||{};ctx.fillStyle='#08101c';ctx.font='bold 14px monospace';ctx.fillText(a.balance!=null?'$'+a.balance.toLocaleString(undefined,{maximumFractionDigits:0}):'$—',vr.x+vr.w/2,vr.y+vr.h-8);
  for(const c of coins){ctx.fillStyle='#ffce4d';ctx.globalAlpha=1-c.t/.6;ctx.beginPath();ctx.arc(c.x,c.y,2,0,7);ctx.fill();ctx.globalAlpha=1;}}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);
  drawBG();drawBelts();for(let i=0;i<NS.length;i++)drawStation(i);
  for(const k of tokens){if(k.st==='drop'){ctx.fillStyle=C.gate;ctx.globalAlpha=.8;ctx.font='10px monospace';ctx.textAlign='center';ctx.fillText('✕',k.x,k.y);ctx.globalAlpha=1;}
    else{ctx.fillStyle=k.col;ctx.beginPath();ctx.arc(k.x,k.y,k.st==='plant'?3:4,0,7);ctx.fill();ctx.globalAlpha=.4;ctx.beginPath();ctx.arc(k.x,k.y,6,0,7);ctx.strokeStyle=k.col;ctx.stroke();ctx.globalAlpha=1;}}
  const ord=orchard();if(!trees.length){ctx.fillStyle='#3a5544';ctx.font='13px monospace';ctx.textAlign='center';ctx.fillText('🌱 orchard bare — no open trades',W*.5,(ord.top+ord.ground)/2);}
  else trees.slice().sort((a,b)=>a.growth-b.growth).forEach(drawTree);
  drawBrain();for(const l of fruits)drawFruit(l);drawVault();
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
</body></html>
